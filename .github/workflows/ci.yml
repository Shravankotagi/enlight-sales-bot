name: CI

on:
  pull_request:
    branches: [main, main_test_2]
  push:
    branches: [main, main_test_2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Tests mock Supabase and LLM calls and block network access, so CI needs no secrets.
env:
  CI: true

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check every source file
        run: |
          set -euo pipefail
          node --check index.js
          find src -name '*.js' -not -name '*.test.js' -print0 | xargs -0 -n1 node --check

  test:
    name: Unit + regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  ci:
    name: ci
    if: always()
    needs: [syntax, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more required jobs did not pass: ${{ toJSON(needs) }}"
          exit 1
      - run: echo "All required jobs passed."
